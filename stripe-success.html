<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

    body { font-family: 'PingFang SC', sans-serif; background: #f5f7fb; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .btn { display: inline-block; margin-top: 20px; padding: 10px 30px; background: #c9a84c; color: #0a2e5c; border-radius: 40px; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">

      };
      let tier = 'free'; // default fallback

      // Try to get tier from session ID – but we can't, so we'll just use a default
