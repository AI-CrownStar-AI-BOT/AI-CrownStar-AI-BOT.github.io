<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>支付成功 · CrownStar</title>
    <style>
        body { font-family: 'PingFang SC','Microsoft YaHei',sans-serif; background:#f5f7fb; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
        .container { background:white; padding:2.5rem; border-radius:20px; box-shadow:0 8px 40px rgba(0,0,0,0.08); text-align:center; max-width:500px; }
        h1 { color:#0a2e5c; }
        .loader { border:4px solid #f3f3f3; border-top:4px solid #c9a84c; border-radius:50%; width:40px; height:40px; animation:spin 1s linear infinite; margin:20px auto; }
        @keyframes spin { 0%{transform:rotate(0deg);}100%{transform:rotate(360deg);} }
        .btn { display:inline-block; margin-top:20px; padding:10px 30px; background:#c9a84c; color:#0a2e5c; border-radius:40px; text-decoration:none; font-weight:600; }
        .btn:hover { background:#dbb95e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ 支付成功！</h1>
        <p>正在为您解锁下载权限...</p>
        <div class="loader"></div>
        <p style="color:#7a7a9a; font-size:0.9rem;">如果未自动跳转，请点击下方按钮</p>
        <a href="#" class="btn" id="continueBtn">前往下载页</a>
    </div>
    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const tier = params.get('tier') || 'basic';
            localStorage.setItem('crownstar_unlocked_' + tier, 'true');
            localStorage.setItem('crownstar_unlocked', 'true');
            const pageMap = {
                'basic': 'download-basic.html',
                'advanced': 'download-advanced.html',
                'professional': 'download-professional.html',
                'org_small': 'download-org_small.html',
                'org_medium': 'download-org_medium.html',
                'org_large': 'download-org_large.html',
                'enterprise': 'download-enterprise.html'
            };
            const targetPage = pageMap[tier] || 'downloads.html';
            document.getElementById('continueBtn').href = targetPage;
            setTimeout(function() { window.location.href = targetPage; }, 2500);
        })();
    </script>
</body>
</html>
